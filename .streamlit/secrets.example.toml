# ZENUX dashboard secrets: an example with placeholders only.
#
# Local:  copy this file to dashboard/.streamlit/secrets.toml (gitignored) and fill in the values.
# Cloud:  paste the same TOML into Streamlit Community Cloud -> your app -> Settings -> Secrets.
#
# Tokens are the Worker secrets of the matching Zenux Workers (deploy/workspace.mjs keeps generated ones in
# .local/<ws>/tokens.json). Never commit real values. The dashboard never displays them.

# Optional: one owner PIN for every workspace. A workspace's own owner_pin overrides it.
# A PIN needs 8 or more characters. The placeholders in this file never unlock anything: until you replace them,
# owner writes stay off. After 5 wrong PINs, the dashboard refuses every PIN for a while (from 1 minute up to 1 hour).
# owner_pin = "REPLACE_WITH_A_PIN_OF_8_OR_MORE_CHARACTERS"

[[workspaces]]
id = "pilot"                                   # the workspace id (workspaces/<id>)
title = "Pilot"                                # shown in the masthead and the workspace switcher
timezone = "America/New_York"                  # times on the Feed, Rejected and Diagnostics tabs
hub_url = "https://zenux-pilot-hub.example.workers.dev"
read_token = "REPLACE_WITH_PILOT_HUB_READ_TOKEN"     # hub READ_TOKEN: every dashboard read
owner_token = "REPLACE_WITH_PILOT_HUB_OWNER_TOKEN"   # hub OWNER_TOKEN: grades, rules, radar decisions
owner_pin = "REPLACE_WITH_THE_PIN_YOU_TYPE"          # unlocks owner_token in the Owner popover (8+ characters)

[[workspaces.modules]]
id = "ai-infra"
url = "https://zenux-pilot-ai-infra.example.workers.dev"
run_token = "REPLACE_WITH_AI_INFRA_RUN_TOKEN"        # module RUN_TOKEN: backfill

[[workspaces.modules]]
id = "defense-unmanned"
url = "https://zenux-pilot-defense-unmanned.example.workers.dev"
run_token = "REPLACE_WITH_DEFENSE_UNMANNED_RUN_TOKEN"

