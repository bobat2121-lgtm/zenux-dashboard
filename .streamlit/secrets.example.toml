# ZENUX dashboard secrets: an example with placeholders only.
#
# Local:  copy this file to dashboard/.streamlit/secrets.toml (gitignored) and fill in the values.
# Cloud:  paste the same TOML into Streamlit Community Cloud -> your app -> Settings -> Secrets.
#
# Tokens are the Worker secrets of the matching Zenux Workers (deploy/workspace.mjs keeps generated ones in
# .local/<ws>/tokens.json). Never commit real values. The dashboard never displays them.

# Open access (beta testing): on by default, so no PIN is asked and anyone with the link can edit and open the
# Control room. Set it to false to require the PINs below again.
# open_access = false

# Optional: one owner PIN for every workspace. A workspace's own owner_pin overrides it.
# A PIN needs 8 or more characters. The placeholders in this file never unlock anything: until you replace them,
# owner writes stay off. After 5 wrong PINs, the dashboard refuses every PIN for a while (from 1 minute up to 1 hour).
# owner_pin = "REPLACE_WITH_A_PIN_OF_8_OR_MORE_CHARACTERS"

# Optional: the builder's PIN, which opens the Control room (health, catch-up, coverage-request review, settings).
# Without it, and only with exactly one workspace (the pilot, where the owner is the builder), the top-level owner_pin
# opens it, else that workspace's owner_pin. With two or more workspaces builder_pin is required: no owner PIN opens
# the Control room then (an analyst who knows a shared PIN would otherwise reach every workspace).
# builder_pin = "REPLACE_WITH_A_BUILDER_PIN_OF_8_OR_MORE_CHARACTERS"

[[workspaces]]
id = "pilot"                                   # the workspace id (workspaces/<id>)
title = "Pilot"                                # shown in the masthead and the workspace switcher
timezone = "America/New_York"                  # times on every tab (briefing names, "next briefing at")
hub_url = "https://zenux-pilot-hub.example.workers.dev"
read_token = "REPLACE_WITH_PILOT_HUB_READ_TOKEN"     # hub READ_TOKEN: every dashboard read
owner_token = "REPLACE_WITH_PILOT_HUB_OWNER_TOKEN"   # hub OWNER_TOKEN: every change the analyst makes
owner_pin = "REPLACE_WITH_THE_PIN_YOU_TYPE"          # unlocks owner_token under "Sign in to edit" (8+ characters)

[[workspaces.modules]]
id = "ai-infra"
url = "https://zenux-pilot-ai-infra.example.workers.dev"
run_token = "REPLACE_WITH_AI_INFRA_RUN_TOKEN"        # module RUN_TOKEN: backfill and the module's detailed health

[[workspaces.modules]]
id = "defense-unmanned"
url = "https://zenux-pilot-defense-unmanned.example.workers.dev"
run_token = "REPLACE_WITH_DEFENSE_UNMANNED_RUN_TOKEN"

# A second analyst's workspace appears in the workspace switcher and in the Control room next to the first
# (add builder_pin above once there are two):
