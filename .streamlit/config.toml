# ZENUX dashboard theme: a black base with white accents, the brand-green top bar and footer. feed.css carries the rest.
[theme]
base = "dark"
primaryColor = "#006341"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#141414"
textColor = "#EDEDED"
font = "sans serif"
linkColor = "#3DDC97"
borderColor = "#2A2A2A"
baseRadius = "6px"
buttonRadius = "6px"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
