# ZENUX dashboard theme: light editorial look (brand green on white, light-gray bands). feed.css carries the rest.
[theme]
base = "light"
primaryColor = "#006341"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#444444"
font = "sans serif"
linkColor = "#006341"
borderColor = "#C4C4C4"
baseRadius = "4px"
buttonRadius = "4px"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
